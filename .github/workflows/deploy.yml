# ============================================================
# GitHub Pages 自動デプロイ ワークフロー
# main ブランチに push するたびに自動でビルドして公開します
# ============================================================

name: Deploy to GitHub Pages

on:
  # main ブランチへの push で自動実行
  push:
    branches: ["main"]
  # 手動でも実行できるようにする
  workflow_dispatch:

# GitHub Pages への書き込み権限を付与
permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイは1つだけ許可
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # コードを取得
      - name: Checkout
        uses: actions/checkout@v4

      # Node.js をセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # GitHub Pages の設定を取得
      - name: Setup Pages
        uses: actions/configure-pages@v5
        id: pages

      # 依存パッケージをインストール
      - name: Install dependencies
        run: npm ci

      # Next.js を静的ファイルとしてビルド
      - name: Build with Next.js
        run: npm run build
        env:
          # GitHub Pages のベースパスを自動設定
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # ビルド結果をアップロード
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # GitHub Pages にデプロイ
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
